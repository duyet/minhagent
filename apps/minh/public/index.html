<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minh — agent</title>
    <meta name="description" content="Minh is a coding agent on Cloudflare Workers." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f1ea;
        --ink: #1b1a17;
        --muted: #5c574e;
        --line: #d4cfc3;
        --card: #fffdf8;
        --accent: #c45c26;
        --minh: #1f4d3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --ink: #efe8d8;
          --muted: #9a9386;
          --line: #2c2a26;
          --card: #1c1b18;
          --accent: #e07a3d;
          --minh: #7dba9a;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        margin: 0;
      }
      header h1 span { color: var(--minh); }
      header p { margin: 0; color: var(--muted); font-size: 0.85rem; }
      #log {
        flex: 1;
        overflow: auto;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .bubble {
        max-width: 40rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 2px;
        white-space: pre-wrap;
        line-height: 1.45;
      }
      .bubble.user { align-self: flex-end; }
      .bubble.minh { align-self: flex-start; }
      .who {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.7rem;
        color: var(--muted);
        margin-bottom: 0.25rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 0.85rem 1.25rem 1.2rem;
        border-top: 1px solid var(--line);
      }
      input {
        flex: 1;
        font: inherit;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1rem;
        border: 0;
        background: var(--minh);
        color: #f4f1ea;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <header>
      <h1><span>Minh</span> agent</h1>
      <p>Cloudflare Workers · Durable Object harness · Computer snippet tool</p>
    </header>
    <div id="log"></div>
    <form id="f">
      <input id="q" autocomplete="off" placeholder="Ask Minh…" />
      <button type="submit">Send</button>
    </form>
    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("f");
      const input = document.getElementById("q");
      const session = crypto.randomUUID();

      function add(who, text) {
        const el = document.createElement("div");
        el.className = "bubble " + (who === "you" ? "user" : "minh");
        el.innerHTML = '<div class="who">' + who + "</div>";
        el.append(document.createTextNode(text));
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      }

      add("minh", "Minh here. I run on a Durable Object. I can evaluate small snippets on Cloudflare Computer (isolate fallback on the Free plan).");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        add("you", message);
        form.querySelector("button").disabled = true;
        try {
          const res = await fetch("/api/chat?session=" + session, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ message }),
          });
          const data = await res.json();
          add("minh", data.text || data.error || JSON.stringify(data));
        } catch (err) {
          add("minh", String(err));
        } finally {
          form.querySelector("button").disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
