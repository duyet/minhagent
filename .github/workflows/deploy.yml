name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "tools/**"
      - "scripts/**"
      - "public/**"
      - "worker.ts"
      - "wrangler.jsonc"
      - "next.config.ts"
      - "open-next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/webhook/**"
      - ".github/workflows/**"
  # Manual re-deploy from the Actions tab (no code change required).
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Deploy Minh and the webhook from a local machine for now.
      # Re-enable wrangler deploy here when CI should ship again.
