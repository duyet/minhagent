name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  # Manual re-deploy from the Actions tab (no code change required).
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: cd apps/web && pnpm run build
        # Clerk's publishable key is a public value (also in wrangler.jsonc
        # vars). Astro only inlines PUBLIC_* env into the client bundle at
        # build time, so prerendered pages need it here too — otherwise the
        # Clerk client script throws "Missing publishableKey" on static pages.
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsubWluaGFnZW50LmRldiQ

      - name: Typecheck
        run: pnpm run typecheck

      - name: Deploy webhook
        run: cd apps/webhook && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web
        # @astrojs/cloudflare v13 emits dist/server/wrangler.json plus a
        # .wrangler/deploy/config.json redirect that plain `wrangler deploy`
        # follows; the old dist/_worker.js layout no longer exists.
        run: cd apps/web && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
